# PREPARED ONLY — DO NOT RUN YET.
# This config is for a later, separately approved free-tier build.
# Guardrails: free tier only (500 macOS M2 minutes/month). Stop before the free
# allowance runs out. NEVER enable pay-as-you-go or add a card without Clare's explicit yes.
# Signing is intentionally absent: it needs an App Store Connect API key (App Manager role)
# created by Clare in App Store Connect. NEVER use her Apple password or a 2FA code here.
#
# Project state after the native step (2026-11-03):
# - ios/ Xcode project exists (generated by `npx cap add ios`, appId com.allinview.app).
# - Native layers: Capacitor Preferences (storage), Capacitor LocalNotifications
#   (reminders), and the AllinViewStoreKit Swift bridge
#   (ios/App/App/AllinViewStoreKit.swift) for StoreKit 2 purchase/restore/entitlement.
# - The Swift bridge has NOT been compiled on a Mac or tested on a real device.
#   The Mac build step must confirm it is in the App target, enable the In-App
#   Purchase capability on com.allinview.app, and test it in TestFlight first.
workflows:
  ios-free-tier-test:
    name: AllinView iOS (free tier, unsigned test build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "26.0"
      # NOTE: node/npm are installed in the build step below; do not cache credentials.
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web bundle and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Verify native layers are present (no signing, no upload)
        script: |
          test -f ios/App/App/AllinViewStoreKit.swift
          test -d ios/App/App.xcworkspace
          grep -q "com.allinview.app" capacitor.config.ts
          grep -q "11.99" src/lib/storekit.ts
          ! grep -Eq "11[.]88" src/lib/storekit.ts src/App.tsx || (echo "FORBIDDEN PRICE FOUND" && exit 1)
      # STOP HERE on the first approved run: verify the project builds.
      # The following steps are NOT enabled until Clare approves signing + TestFlight:
      # - name: Build iOS app (requires signing, API key, and a Mac with Xcode 26)
      #   script: |
      #     xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release archive
      # - name: Publish to TestFlight (requires App Store Connect API key + approval)
      #   script: |
      #     echo "NOT ENABLED — needs Clare's approval and API key"
    artifacts:
      - dist/**/*
      - ios/App/App/AllinViewStoreKit.swift
