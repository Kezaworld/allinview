# AllinView — SIGNED Codemagic config v2 (CANDIDATE — NOT uploaded, NOT run).
# Prepared Nov 3, 2026, after two signed builds failed at IPA archiving.
# DO NOT push this to GitHub and DO NOT run ios-signed-testflight until the
# OUTSIDE-YAML steps at the bottom are done (a provisioning profile must
# exist in Codemagic first, or the build will fail again — this time with a
# clear "no profile fetched" error from the verify step below).
#
# WHAT CHANGED AND WHY (the actual fix):
# The v1 signed workflow mixed Codemagic's TWO different signing methods,
# and that is why it failed:
# - Method A (Code Signing Identities, UI method — Codemagic docs:
#   https://docs.codemagic.io/yaml-code-signing/signing-ios/): certificates
#   and profiles are uploaded/generated once in Codemagic Team settings >
#   Code signing identities, then referenced in codemagic.yaml with
#   environment.ios_signing (distribution_type + bundle_identifier, or
#   explicit reference names). Codemagic fetches them automatically during
#   the build; the keychain/fetch CLI scripts are NOT required, and the
#   step before the build is only `xcode-project use-profiles`.
# - Method B (CLI automatic signing — Codemagic docs:
#   https://docs.codemagic.io/yaml-code-signing/alternative-code-signing-methods/):
#   the build itself creates/fetches certificates and profiles with
#   `app-store-connect fetch-signing-files --create`. That method does NOT
#   see Method A files. It needs a CERTIFICATE_PRIVATE_KEY: a 2048-bit RSA
#   private key, stored as a SECRET Codemagic environment variable in a
#   group referenced by the workflow. Without it, fetch fails with exactly
#   the log lines seen on both failed builds: "Cannot save Signing
#   Certificates without certificate private key", "Did not find any
#   certificates from specified locations", "Did not find matching
#   provisioning profiles", empty profile list, blank certificate/team.
# v1 used Method B scripts but supplied NO certificate private key, so it
# could never use the Method A certificate that was later generated in the
# UI ("AllinView Distribution Certificate", Apple Distribution, expires
# Nov 3, 2027). The UI certificate's private key is held inside Codemagic;
# it is NOT in the repo, NOT in chat, and NOT available to the CLI fetch.
# v2 therefore switches the signed workflow to Method A (the method that
# reuses the certificate that already exists) and REMOVES the CLI signing
# scripts (keychain initialize / fetch-signing-files / add-certificates).
# It does NOT guess a certificate reference name: the distribution_type +
# bundle_identifier form auto-matches uploaded files, so no reference name
# is needed in the yaml. (The name "AllinView Distribution Certificate"
# reported from the UI may or may not be the reference name entered at
# Generate time — do NOT put it in the yaml as a reference name.)
#
# WHAT v2 DOES NOT DO:
# - It does NOT create a second distribution certificate, does NOT invent
#   or paste any private key, does NOT put any secret in the yaml or repo.
# - It does NOT fix StoreKit by itself. AllinViewStoreKit.swift is still not
#   referenced in project.pbxproj (warning step kept), and the In-App
#   Purchase capability is still not enabled for com.allinview.app.
#   See OUTSIDE-YAML steps 4–5.
#
# OUTSIDE-YAML STEPS, IN ORDER (must be done in Codemagic / Apple UI —
# a browser agent can do the Codemagic parts; the Apple portal part is
# Clare's Account Holder account, guided screen-by-screen if needed):
#  1. CREATE THE PROVISIONING PROFILE (the remaining missing piece).
#     Codemagic Team > Code signing identities > iOS provisioning profiles
#     > Fetch profiles returned 0, because NO profile exists on Apple yet.
#     Create one first in Apple Developer portal (developer.apple.com >
#     Certificates, Identifiers & Profiles > Profiles > +): type App Store
#     Connect (distribution), App ID com.allinview.app, certificate =
#     the AllinView Distribution Certificate. Then, in Codemagic Team >
#     Code signing identities > iOS provisioning profiles, either Fetch
#     profiles (the new profile should now appear — give it a reference
#     name) or Upload the downloaded .mobileprovision file with a
#     reference name. This step needs NO secret and NO key file in chat.
#  2. VERIFY in Codemagic Team > Code signing identities that BOTH are
#     listed: (a) the AllinView Distribution Certificate, and (b) an App
#     Store profile for com.allinview.app whose Certificate column shows
#     a green checkmark (matching certificate). If the profile column
#     shows no matching certificate, do NOT run the build — the profile
#     was made with a different certificate.
#  3. ONLY THEN upload this file to GitHub as codemagic.yaml (overwriting
#     the v1 signed config) and run ONLY ios-signed-testflight, branch
#     main, free tier only, no pay-as-you-go, TestFlight only
#     (submit_to_app_store: false — unchanged).
#  4. BEFORE ANY PURCHASE-READY TESTFLIGHT BUILD (not before a build-path
#     test): on a Mac in Xcode, add AllinViewStoreKit.swift to the App
#     target in project.pbxproj and confirm it compiles. Do NOT hand-edit
#     project.pbxproj blind on Linux.
#  5. BEFORE ANY PURCHASE-READY TESTFLIGHT BUILD: enable the In-App
#     Purchase capability for com.allinview.app (Apple Developer portal >
#     Identifiers). Note: enabling it does NOT block profile creation —
#     a profile can be created now — but a profile created BEFORE the
#     capability is enabled will NOT include it, so after enabling IAP
#     the profile must be regenerated/re-fetched before a purchase test.
#     (Codemagic docs note: essential changes such as adding capabilities
#     invalidate a profile; generate a new one with the updates.)
#
# ALTERNATIVE PATH (documented here, NOT active in this file — use only
# if the Method A path cannot be used, and only with Clare's explicit yes
# for a new key, because it creates a SECOND distribution certificate):
#  Method B, CLI automatic signing. Clare (or a browser agent at her
#  direction, never in chat) generates a NEW 2048-bit RSA private key on
#  her own computer (e.g. `ssh-keygen -t rsa -b 2048 -m PEM -f
#  ios_distribution_private_key -q -N ""`), stores its ENTIRE contents as
#  a SECRET Codemagic environment variable named CERTIFICATE_PRIVATE_KEY
#  in a new group (e.g. `code-signing`), adds `groups: [code-signing]` to
#  the workflow environment, and changes the fetch step to
#  `app-store-connect fetch-signing-files "$BUNDLE_ID" --type
#  IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create`
#  (the @env: form is from the codemagic-cli-tools fetch-signing-files
#  docs; without --certificate-key the tool falls back to the
#  CERTIFICATE_PRIVATE_KEY environment variable). That path creates a new
#  Apple Distribution certificate from that key (Apple limit: 3
#  distribution certificates; one already exists, so a second is allowed)
#  and, per Codemagic docs, fetches or creates the matching provisioning
#  profile. UNVERIFIED: whether an App Manager API key can create
#  certificates/profiles via this CLI path — Codemagic docs recommend App
#  Manager, but other sources say certificate/profile creation via the
#  App Store Connect API requires Admin. If --create returns a 403, the
#  fallback is an Admin-role API key (created by Clare herself in App
#  Store Connect, never in chat) or the Method A manual profile step
#  above. Do NOT mix Method A and Method B in one workflow.
#
# Cost guardrails (unchanged): free tier only (500 macOS M2 minutes/
# month). Stop before the allowance runs out. NEVER enable pay-as-you-go
# or add a card without Clare's explicit yes. No App Store submission.
#
workflows:
  ios-free-tier-test:
    name: AllinView iOS (free tier, unsigned test build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "26.0"
      # NOTE: node/npm are installed in the build step below; do not cache credentials.
    scripts:
      - name: Rebuild folder structure from flat repo (no-op if already structured)
        script: |
          set -e
          # Move a flat file into place only if the flat file exists AND the
          # target does not already exist. Never overwrites, never fails on
          # a missing flat file.
          move_flat() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }
          # Web sources -> src/
          move_flat App.tsx src/App.tsx
          move_flat App.css src/App.css
          move_flat main.tsx src/main.tsx
          # Web sources -> src/lib/
          move_flat types.ts src/lib/types.ts
          move_flat store.ts src/lib/store.ts
          move_flat payoff.ts src/lib/payoff.ts
          move_flat storekit.ts src/lib/storekit.ts
          move_flat native.ts src/lib/native.ts
          # Swift sources -> ios/App/App/
          move_flat AllinViewStoreKit.swift ios/App/App/AllinViewStoreKit.swift
          move_flat AppDelegate.swift ios/App/App/AppDelegate.swift
          move_flat Info.plist ios/App/App/Info.plist
          # Storyboards -> ios/App/App/Base.lproj/
          move_flat LaunchScreen.storyboard ios/App/App/Base.lproj/LaunchScreen.storyboard
          move_flat Main.storyboard ios/App/App/Base.lproj/Main.storyboard
          # Xcode project files
          move_flat project.pbxproj ios/App/App.xcodeproj/project.pbxproj
          move_flat IDEWorkspaceChecks.plist ios/App/App.xcworkspace/xcshareddata/IDEWorkspaceChecks.plist
          move_flat Podfile ios/App/Podfile
          # Assets: splash images -> Splash.imageset/, app icon -> AppIcon.appiconset/
          move_flat splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
          move_flat splash-2732x2732-1.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          move_flat splash-2732x2732-2.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          move_flat AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # Contents.json files: the flat copies are AMBIGUOUS (Windows renamed
          # the three originals to Contents.json, "Contents (1).json" and
          # "Contents (2).json"), so they are NEVER moved or guessed. Instead
          # write the exact original Contents.json content (base64, decoded
          # here) into each of the three correct locations. Identical to the
          # originals in the standalone rebuild; overwriting a correct copy
          # with the same bytes is harmless.
          mkdir -p ios/App/App/Assets.xcassets ios/App/App/Assets.xcassets/AppIcon.appiconset ios/App/App/Assets.xcassets/Splash.imageset
          echo 'ewogICJpbmZvIiA6IHsKICAgICJ2ZXJzaW9uIiA6IDEsCiAgICAiYXV0aG9yIiA6ICJ4Y29kZSIKICB9Cn0=' | base64 -d > ios/App/App/Assets.xcassets/Contents.json
          echo 'ewogICJpbWFnZXMiIDogWwogICAgewogICAgICAiZmlsZW5hbWUiIDogIkFwcEljb24tNTEyQDJ4LnBuZyIsCiAgICAgICJpZGlvbSIgOiAidW5pdmVyc2FsIiwKICAgICAgInBsYXRmb3JtIiA6ICJpb3MiLAogICAgICAic2l6ZSIgOiAiMTAyNHgxMDI0IgogICAgfQogIF0sCiAgImluZm8iIDogewogICAgImF1dGhvciIgOiAieGNvZGUiLAogICAgInZlcnNpb24iIDogMQogIH0KfQo=' | base64 -d > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '' | base64 -d > ios/App/App/Assets.xcassets/Splash.imageset/Contents.json
          # ios/.gitignore: write the exact original only if it is missing.
          # The flat repo may hold a root .gitignore, an ios one, or neither
          # under a renamed name; writing the known-good content when absent
          # is safe and never overwrites an existing file.
          if [ ! -f ios/.gitignore ]; then
            echo 'QXBwL2J1aWxkCkFwcC9Qb2RzCkFwcC9vdXRwdXQKQXBwL0FwcC9wdWJsaWMKRGVyaXZlZERhdGEKeGN1c2VyZGF0YQoKIyBDb3Jkb3ZhIHBsdWdpbnMgZm9yIENhcGFjaXRvcgpjYXBhY2l0b3ItY29yZG92YS1pb3MtcGx1Z2lucwoKIyBHZW5lcmF0ZWQgQ29uZmlnIGZpbGVzCkFwcC9BcHAvY2FwYWNpdG9yLmNvbmZpZy5qc29uCkFwcC9BcHAvY29uZmlnLnhtbAo=' | base64 -d > ios/.gitignore
          fi
          # Remove only the ambiguous flat Contents.json copies at the root
          # (now superseded by the correct files written above). Harmless
          # no-op when they do not exist.
          rm -f Contents.json 'Contents (1).json' 'Contents (2).json'
          # Report what the tree now looks like, for the build log.
          echo '--- reconstructed tree (key files) ---'
          ls src src/lib ios/App/App ios/App/App.xcodeproj ios/App/App.xcworkspace/xcshareddata ios/App 2>&1 || true
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web bundle and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Verify native layers are present (no signing, no upload)
        script: |
          test -f ios/App/App/AllinViewStoreKit.swift
          test -d ios/App/App.xcworkspace
          grep -q "com.allinview.app" capacitor.config.ts
          grep -q "11.99" src/lib/storekit.ts
          ! grep -Eq "11[.]88" src/lib/storekit.ts src/App.tsx || (echo "FORBIDDEN PRICE FOUND" && exit 1)

  ios-signed-testflight:
    name: AllinView iOS (signed, TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # VERIFIED (Codemagic docs/examples): the integration name here must
    # match EXACTLY the name Clare gives the key in Codemagic Team settings
    # > Integrations > Developer Portal. No key material is in this file.
    integrations:
      app_store_connect: 'AllinView Build'
    environment:
      vars:
        XCODE_VERSION: "26.0"
        BUNDLE_ID: "com.allinview.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.allinview.app
    scripts:
      - name: Rebuild folder structure from flat repo (signed workflow)
        script: |
          set -e
          # Move a flat file into place only if the flat file exists AND the
          # target does not already exist. Never overwrites, never fails on
          # a missing flat file.
          move_flat() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }
          # Web sources -> src/
          move_flat App.tsx src/App.tsx
          move_flat App.css src/App.css
          move_flat main.tsx src/main.tsx
          # Web sources -> src/lib/
          move_flat types.ts src/lib/types.ts
          move_flat store.ts src/lib/store.ts
          move_flat payoff.ts src/lib/payoff.ts
          move_flat storekit.ts src/lib/storekit.ts
          move_flat native.ts src/lib/native.ts
          # Swift sources -> ios/App/App/
          move_flat AllinViewStoreKit.swift ios/App/App/AllinViewStoreKit.swift
          move_flat AppDelegate.swift ios/App/App/AppDelegate.swift
          move_flat Info.plist ios/App/App/Info.plist
          # Storyboards -> ios/App/App/Base.lproj/
          move_flat LaunchScreen.storyboard ios/App/App/Base.lproj/LaunchScreen.storyboard
          move_flat Main.storyboard ios/App/App/Base.lproj/Main.storyboard
          # Xcode project files
          move_flat project.pbxproj ios/App/App.xcodeproj/project.pbxproj
          move_flat IDEWorkspaceChecks.plist ios/App/App.xcworkspace/xcshareddata/IDEWorkspaceChecks.plist
          move_flat Podfile ios/App/Podfile
          # Assets: splash images -> Splash.imageset/, app icon -> AppIcon.appiconset/
          move_flat splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
          move_flat splash-2732x2732-1.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          move_flat splash-2732x2732-2.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          move_flat AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # Contents.json files: the flat copies are AMBIGUOUS (Windows renamed
          # the three originals to Contents.json, "Contents (1).json" and
          # "Contents (2).json"), so they are NEVER moved or guessed. Instead
          # write the exact original Contents.json content (base64, decoded
          # here) into each of the three correct locations. Identical to the
          # originals in the standalone rebuild; overwriting a correct copy
          # with the same bytes is harmless.
          mkdir -p ios/App/App/Assets.xcassets ios/App/App/Assets.xcassets/AppIcon.appiconset ios/App/App/Assets.xcassets/Splash.imageset
          echo 'ewogICJpbmZvIiA6IHsKICAgICJ2ZXJzaW9uIiA6IDEsCiAgICAiYXV0aG9yIiA6ICJ4Y29kZSIKICB9Cn0=' | base64 -d > ios/App/App/Assets.xcassets/Contents.json
          echo 'ewogICJpbWFnZXMiIDogWwogICAgewogICAgICAiZmlsZW5hbWUiIDogIkFwcEljb24tNTEyQDJ4LnBuZyIsCiAgICAgICJpZGlvbSIgOiAidW5pdmVyc2FsIiwKICAgICAgInBsYXRmb3JtIiA6ICJpb3MiLAogICAgICAic2l6ZSIgOiAiMTAyNHgxMDI0IgogICAgfQogIF0sCiAgImluZm8iIDogewogICAgImF1dGhvciIgOiAieGNvZGUiLAogICAgInZlcnNpb24iIDogMQogIH0KfQo=' | base64 -d > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '' | base64 -d > ios/App/App/Assets.xcassets/Splash.imageset/Contents.json
          # ios/.gitignore: write the exact original only if it is missing.
          # The flat repo may hold a root .gitignore, an ios one, or neither
          # under a renamed name; writing the known-good content when absent
          # is safe and never overwrites an existing file.
          if [ ! -f ios/.gitignore ]; then
            echo 'QXBwL2J1aWxkCkFwcC9Qb2RzCkFwcC9vdXRwdXQKQXBwL0FwcC9wdWJsaWMKRGVyaXZlZERhdGEKeGN1c2VyZGF0YQoKIyBDb3Jkb3ZhIHBsdWdpbnMgZm9yIENhcGFjaXRvcgpjYXBhY2l0b3ItY29yZG92YS1pb3MtcGx1Z2lucwoKIyBHZW5lcmF0ZWQgQ29uZmlnIGZpbGVzCkFwcC9BcHAvY2FwYWNpdG9yLmNvbmZpZy5qc29uCkFwcC9BcHAvY29uZmlnLnhtbAo=' | base64 -d > ios/.gitignore
          fi
          # Remove only the ambiguous flat Contents.json copies at the root
          # (now superseded by the correct files written above). Harmless
          # no-op when they do not exist.
          rm -f Contents.json 'Contents (1).json' 'Contents (2).json'
          # Report what the tree now looks like, for the build log.
          echo '--- reconstructed tree (key files) ---'
          ls src src/lib ios/App/App ios/App/App.xcodeproj ios/App/App.xcworkspace/xcshareddata ios/App 2>&1 || true
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web bundle and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Check StoreKit bridge is in Xcode target (WARNING only)
        script: |
          test -f ios/App/App/AllinViewStoreKit.swift
          if grep -q "AllinViewStoreKit.swift" ios/App/App.xcodeproj/project.pbxproj; then
            echo "StoreKit bridge IS referenced in project.pbxproj."
          else
            echo "WARNING: AllinViewStoreKit.swift is on disk but NOT referenced in project.pbxproj."
            echo "WARNING: This build may succeed, but StoreKit purchases will NOT work until the file is added to the App target in Xcode."
            echo "WARNING: Treat this TestFlight build as a build-path test only, NOT a purchase-ready build."
          fi
      # METHOD A (Code Signing Identities): Codemagic fetches the
      # uploaded/generated certificate + profile automatically from
      # environment.ios_signing above. No keychain/fetch CLI scripts.
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Verify a provisioning profile was fetched (fail fast if not)
        script: |
          ls ~/Library/MobileDevice/"Provisioning Profiles" 2>&1 || true
          ls ~/Library/MobileDevice/"Provisioning Profiles"/*.mobileprovision >/dev/null 2>&1 || (echo "ERROR: No provisioning profile was fetched from Code Signing Identities. Create/upload an App Store profile for com.allinview.app first (see file header), then re-run." && exit 1)
      - name: Verify native layers are present (no upload yet)
        script: |
          test -f ios/App/App/AllinViewStoreKit.swift
          test -d ios/App/App.xcworkspace
          grep -q "com.allinview.app" capacitor.config.ts
          grep -q "11.99" src/lib/storekit.ts
          ! grep -Eq "11[.]88" src/lib/storekit.ts src/App.tsx || (echo "FORBIDDEN PRICE FOUND" && exit 1)
      - name: Build IPA for distribution
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - dist/**/*
      - build/ios/ipa/*.ipa
      - ios/App/App/AllinViewStoreKit.swift
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
