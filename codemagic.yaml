# AllinView — SIGNED Codemagic config v3 (PURCHASE-FIXED — NOT uploaded, NOT run).
# Prepared Nov 3, 2026, after the StoreKit wiring fix (see below).
# DO NOT RUN THIS WORKFLOW UNTIL ALL THREE PRECONDITIONS ARE MET, IN ORDER:
#   1. IAP CAPABILITY: enable In-App Purchase for App ID com.allinview.app in
#      Apple Developer portal > Identifiers. (Portal step — separate, not in yaml.)
#   2. PROFILE REGENERATION: after step 1, REGENERATE the App Store provisioning
#      profile 'AllinView App Store Distribution' (a profile made BEFORE the IAP
#      capability was enabled does NOT include it) and re-fetch it in Codemagic
#      Team > Code signing identities, confirming the matching-certificate
#      green checkmark. If you run v3 with the old profile, the build may
#      succeed but StoreKit purchases can fail.
#   3. UPLOAD: push the purchase-fixed project to GitHub (wired project.pbxproj,
#      approved 1024x1024 icon, updated src/, scripts/) and upload THIS file as
#      codemagic.yaml, then run ONLY ios-signed-appstore, branch main, free
#      tier only, no pay-as-you-go.
# WHAT CHANGED vs v2 (v2 = signed build that succeeded Nov 3, build 1.0 (1)):
#   - AllinViewStoreKit.swift is now IN the App target (project.pbxproj) AND
#     registered in capacitor.config.json packageClassList (post-sync step
#     below — `npx cap sync ios` regenerates that list from npm packages only
#     and would otherwise drop the App-target plugin, leaving purchases dead).
#   - SWIFT_VERSION 5.0 -> 5.9 (StoreKit 2 async/await needs Swift 5.5+) and
#     IPHONEOS_DEPLOYMENT_TARGET 14.0 -> 15.0 (StoreKit 2 needs iOS 15+).
#   - CURRENT_PROJECT_VERSION 1 -> 2 (build 1.0 (1) is already in App Store
#     Connect, so the next upload must be build 2; MARKETING_VERSION stays 1.0).
#   - App icon replaced: the binary previously shipped a generic placeholder
#     icon; it now ships Clare's approved 1024x1024 eye-and-wing icon.
#   - The old WARNING-only StoreKit check is now FAIL-FAST (see verify step).
#   - User-facing "NOT been tested" wording removed from the Premium section.
#   - Pricing UNCHANGED: $0.99/mo, $11.99/yr, first month free both. No
#     auto-save added, no front-page redesign.
# PUBLISHING — READ THIS: submit_to_testflight: false AND submit_to_app_store:
# false are both set on purpose (per Clare's Nov 3 choice: fix purchases,
# then submit to the App Store manually in App Store Connect). With both
# false, Codemagic will BUILD the IPA but will NOT upload it to App Store
# Connect — the IPA stays in this build's artifacts. To get build 2 into
# App Store Connect you must EITHER (a) upload the IPA manually with
# Transporter, OR (b) at run time change submit_to_testflight to true so
# Codemagic uploads it (it then appears as Ready to Submit in App Store
# Connect, where the App Store submission itself is still done manually).
# Do NOT flip submit_to_app_store to true without Clare's explicit word.
# Cost guardrails (unchanged): free tier only (500 macOS M2 minutes/month).
# NEVER enable pay-as-you-go or add a card without Clare's explicit yes.
# What v3 does NOT do: it does NOT enable the IAP capability itself, does
# NOT regenerate the profile, does NOT submit anything to Apple, does NOT
# guarantee App Store approval (Apple decides), and does NOT test purchases
# on a real device — that test is still required before submission.

workflows:
  ios-free-tier-test:
    name: AllinView iOS (free tier, unsigned test build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_VERSION: "26.0"
      # NOTE: node/npm are installed in the build step below; do not cache credentials.
    scripts:
      - name: Rebuild folder structure from flat repo (no-op if already structured)
        script: |
          set -e
          # Move a flat file into place only if the flat file exists AND the
          # target does not already exist. Never overwrites, never fails on
          # a missing flat file.
          move_flat() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }
          # Web sources -> src/
          move_flat App.tsx src/App.tsx
          move_flat App.css src/App.css
          move_flat main.tsx src/main.tsx
          # Web sources -> src/lib/
          move_flat types.ts src/lib/types.ts
          move_flat store.ts src/lib/store.ts
          move_flat payoff.ts src/lib/payoff.ts
          move_flat storekit.ts src/lib/storekit.ts
          move_flat native.ts src/lib/native.ts
          # Swift sources -> ios/App/App/
          move_flat AllinViewStoreKit.swift ios/App/App/AllinViewStoreKit.swift
          move_flat AppDelegate.swift ios/App/App/AppDelegate.swift
          move_flat Info.plist ios/App/App/Info.plist
          # Storyboards -> ios/App/App/Base.lproj/
          move_flat LaunchScreen.storyboard ios/App/App/Base.lproj/LaunchScreen.storyboard
          move_flat Main.storyboard ios/App/App/Base.lproj/Main.storyboard
          # Xcode project files
          move_flat project.pbxproj ios/App/App.xcodeproj/project.pbxproj
          move_flat IDEWorkspaceChecks.plist ios/App/App.xcworkspace/xcshareddata/IDEWorkspaceChecks.plist
          move_flat Podfile ios/App/Podfile
          # Assets: splash images -> Splash.imageset/, app icon -> AppIcon.appiconset/
          move_flat splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
          move_flat splash-2732x2732-1.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          move_flat splash-2732x2732-2.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          move_flat AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # Contents.json files: the flat copies are AMBIGUOUS (Windows renamed
          # the three originals to Contents.json, "Contents (1).json" and
          # "Contents (2).json"), so they are NEVER moved or guessed. Instead
          # write the exact original Contents.json content (base64, decoded
          # here) into each of the three correct locations. Identical to the
          # originals in the standalone rebuild; overwriting a correct copy
          # with the same bytes is harmless.
          mkdir -p ios/App/App/Assets.xcassets ios/App/App/Assets.xcassets/AppIcon.appiconset ios/App/App/Assets.xcassets/Splash.imageset
          echo 'ewogICJpbmZvIiA6IHsKICAgICJ2ZXJzaW9uIiA6IDEsCiAgICAiYXV0aG9yIiA6ICJ4Y29kZSIKICB9Cn0=' | base64 -d > ios/App/App/Assets.xcassets/Contents.json
          echo 'ewogICJpbWFnZXMiIDogWwogICAgewogICAgICAiZmlsZW5hbWUiIDogIkFwcEljb24tNTEyQDJ4LnBuZyIsCiAgICAgICJpZGlvbSIgOiAidW5pdmVyc2FsIiwKICAgICAgInBsYXRmb3JtIiA6ICJpb3MiLAogICAgICAic2l6ZSIgOiAiMTAyNHgxMDI0IgogICAgfQogIF0sCiAgImluZm8iIDogewogICAgImF1dGhvciIgOiAieGNvZGUiLAogICAgInZlcnNpb24iIDogMQogIH0KfQo=' | base64 -d > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '' | base64 -d > ios/App/App/Assets.xcassets/Splash.imageset/Contents.json
          # ios/.gitignore: write the exact original only if it is missing.
          # The flat repo may hold a root .gitignore, an ios one, or neither
          # under a renamed name; writing the known-good content when absent
          # is safe and never overwrites an existing file.
          if [ ! -f ios/.gitignore ]; then
            echo 'QXBwL2J1aWxkCkFwcC9Qb2RzCkFwcC9vdXRwdXQKQXBwL0FwcC9wdWJsaWMKRGVyaXZlZERhdGEKeGN1c2VyZGF0YQoKIyBDb3Jkb3ZhIHBsdWdpbnMgZm9yIENhcGFjaXRvcgpjYXBhY2l0b3ItY29yZG92YS1pb3MtcGx1Z2lucwoKIyBHZW5lcmF0ZWQgQ29uZmlnIGZpbGVzCkFwcC9BcHAvY2FwYWNpdG9yLmNvbmZpZy5qc29uCkFwcC9BcHAvY29uZmlnLnhtbAo=' | base64 -d > ios/.gitignore
          fi
          # Remove only the ambiguous flat Contents.json copies at the root
          # (now superseded by the correct files written above). Harmless
          # no-op when they do not exist.
          rm -f Contents.json 'Contents (1).json' 'Contents (2).json'
          # Report what the tree now looks like, for the build log.
          echo '--- reconstructed tree (key files) ---'
          ls src src/lib ios/App/App ios/App/App.xcodeproj ios/App/App.xcworkspace/xcshareddata ios/App 2>&1 || true
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web bundle and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Verify native layers are present (no signing, no upload)
        script: |
          test -f ios/App/App/AllinViewStoreKit.swift
          test -d ios/App/App.xcworkspace
          grep -q "com.allinview.app" capacitor.config.ts
          grep -q "11.99" src/lib/storekit.ts
          ! grep -Eq "11[.]88" src/lib/storekit.ts src/App.tsx || (echo "FORBIDDEN PRICE FOUND" && exit 1)

  ios-signed-appstore:
    name: AllinView iOS (signed, App Store build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # VERIFIED (Codemagic docs/examples): the integration name here must
    # match EXACTLY the name Clare gives the key in Codemagic Team settings
    # > Integrations > Developer Portal. No key material is in this file.
    integrations:
      app_store_connect: 'AllinView Build'
    environment:
      vars:
        XCODE_VERSION: "26.0"
        BUNDLE_ID: "com.allinview.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.allinview.app
    scripts:
      - name: Rebuild folder structure from flat repo (signed workflow)
        script: |
          set -e
          # Move a flat file into place only if the flat file exists AND the
          # target does not already exist. Never overwrites, never fails on
          # a missing flat file.
          move_flat() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }
          # Web sources -> src/
          move_flat App.tsx src/App.tsx
          move_flat App.css src/App.css
          move_flat main.tsx src/main.tsx
          # Web sources -> src/lib/
          move_flat types.ts src/lib/types.ts
          move_flat store.ts src/lib/store.ts
          move_flat payoff.ts src/lib/payoff.ts
          move_flat storekit.ts src/lib/storekit.ts
          move_flat native.ts src/lib/native.ts
          # Swift sources -> ios/App/App/
          move_flat AllinViewStoreKit.swift ios/App/App/AllinViewStoreKit.swift
          move_flat AppDelegate.swift ios/App/App/AppDelegate.swift
          move_flat Info.plist ios/App/App/Info.plist
          # Storyboards -> ios/App/App/Base.lproj/
          move_flat LaunchScreen.storyboard ios/App/App/Base.lproj/LaunchScreen.storyboard
          move_flat Main.storyboard ios/App/App/Base.lproj/Main.storyboard
          # Xcode project files
          move_flat project.pbxproj ios/App/App.xcodeproj/project.pbxproj
          move_flat IDEWorkspaceChecks.plist ios/App/App.xcworkspace/xcshareddata/IDEWorkspaceChecks.plist
          move_flat Podfile ios/App/Podfile
          # Assets: splash images -> Splash.imageset/, app icon -> AppIcon.appiconset/
          move_flat splash-2732x2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
          move_flat splash-2732x2732-1.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          move_flat splash-2732x2732-2.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          move_flat AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # Contents.json files: the flat copies are AMBIGUOUS (Windows renamed
          # the three originals to Contents.json, "Contents (1).json" and
          # "Contents (2).json"), so they are NEVER moved or guessed. Instead
          # write the exact original Contents.json content (base64, decoded
          # here) into each of the three correct locations. Identical to the
          # originals in the standalone rebuild; overwriting a correct copy
          # with the same bytes is harmless.
          mkdir -p ios/App/App/Assets.xcassets ios/App/App/Assets.xcassets/AppIcon.appiconset ios/App/App/Assets.xcassets/Splash.imageset
          echo 'ewogICJpbmZvIiA6IHsKICAgICJ2ZXJzaW9uIiA6IDEsCiAgICAiYXV0aG9yIiA6ICJ4Y29kZSIKICB9Cn0=' | base64 -d > ios/App/App/Assets.xcassets/Contents.json
          echo 'ewogICJpbWFnZXMiIDogWwogICAgewogICAgICAiZmlsZW5hbWUiIDogIkFwcEljb24tNTEyQDJ4LnBuZyIsCiAgICAgICJpZGlvbSIgOiAidW5pdmVyc2FsIiwKICAgICAgInBsYXRmb3JtIiA6ICJpb3MiLAogICAgICAic2l6ZSIgOiAiMTAyNHgxMDI0IgogICAgfQogIF0sCiAgImluZm8iIDogewogICAgImF1dGhvciIgOiAieGNvZGUiLAogICAgInZlcnNpb24iIDogMQogIH0KfQo=' | base64 -d > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '' | base64 -d > ios/App/App/Assets.xcassets/Splash.imageset/Contents.json
          # ios/.gitignore: write the exact original only if it is missing.
          # The flat repo may hold a root .gitignore, an ios one, or neither
          # under a renamed name; writing the known-good content when absent
          # is safe and never overwrites an existing file.
          if [ ! -f ios/.gitignore ]; then
            echo 'QXBwL2J1aWxkCkFwcC9Qb2RzCkFwcC9vdXRwdXQKQXBwL0FwcC9wdWJsaWMKRGVyaXZlZERhdGEKeGN1c2VyZGF0YQoKIyBDb3Jkb3ZhIHBsdWdpbnMgZm9yIENhcGFjaXRvcgpjYXBhY2l0b3ItY29yZG92YS1pb3MtcGx1Z2lucwoKIyBHZW5lcmF0ZWQgQ29uZmlnIGZpbGVzCkFwcC9BcHAvY2FwYWNpdG9yLmNvbmZpZy5qc29uCkFwcC9BcHAvY29uZmlnLnhtbAo=' | base64 -d > ios/.gitignore
          fi
          # Remove only the ambiguous flat Contents.json copies at the root
          # (now superseded by the correct files written above). Harmless
          # no-op when they do not exist.
          rm -f Contents.json 'Contents (1).json' 'Contents (2).json'
          # Report what the tree now looks like, for the build log.
          echo '--- reconstructed tree (key files) ---'
          ls src src/lib ios/App/App ios/App/App.xcodeproj ios/App/App.xcworkspace/xcshareddata ios/App 2>&1 || true
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web bundle and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Register StoreKit plugin after sync (REQUIRED — sync wipes it)
        script: |
          # cap sync regenerates packageClassList from npm packages only, so
          # the App-target AllinViewStoreKit plugin must be re-added here, or
          # JavaScript can never reach the Swift bridge and purchases fail.
          python3 - <<'PYEOF'
          import json, sys
          cfg = 'ios/App/App/capacitor.config.json'
          data = json.load(open(cfg))
          lst = data.get('packageClassList', [])
          if 'AllinViewStoreKit' not in lst:
              lst.append('AllinViewStoreKit')
              data['packageClassList'] = lst
              json.dump(data, open(cfg, 'w'), indent='\t')
              open(cfg, 'a').write('\n')
          print('packageClassList:', data['packageClassList'])
          assert 'AllinViewStoreKit' in data['packageClassList']
          PYEOF
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Verify purchase wiring (FAIL FAST — no silent broken paywall)
        script: |
          set -e
          test -f ios/App/App/AllinViewStoreKit.swift || (echo "ERROR: AllinViewStoreKit.swift missing from ios/App/App/" && exit 1)
          grep -q "AllinViewStoreKit.swift in Sources" ios/App/App.xcodeproj/project.pbxproj || (echo "ERROR: AllinViewStoreKit.swift is NOT in the Xcode project Sources phase — the paywall would not work. Fix project.pbxproj (scripts/wire-storekit.py) and re-upload before running." && exit 1)
          grep -q "AllinViewStoreKit" ios/App/App/capacitor.config.json || (echo "ERROR: AllinViewStoreKit is NOT in capacitor.config.json packageClassList — JavaScript cannot reach the Swift bridge. The register step above must have failed." && exit 1)
          grep -q "CURRENT_PROJECT_VERSION = 2;" ios/App/App.xcodeproj/project.pbxproj || (echo "ERROR: build number is not 2 — build 1.0 (1) is already in App Store Connect, so this upload would be rejected as a duplicate." && exit 1)
          grep -q "SWIFT_VERSION = 5.9;" ios/App/App.xcodeproj/project.pbxproj || (echo "ERROR: SWIFT_VERSION is not 5.9 — StoreKit 2 async/await will not compile under Swift 5.0." && exit 1)
          # App icon must be Clare's approved 1024x1024 icon (sips is macOS-only, this runs on a Mac).
          ICON_W=$(sips -g pixelWidth ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png | awk '/pixelWidth/{print $2}')
          ICON_H=$(sips -g pixelHeight ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png | awk '/pixelHeight/{print $2}')
          [ "$ICON_W" = "1024" ] && [ "$ICON_H" = "1024" ] || (echo "ERROR: app icon is not 1024x1024 (got ${ICON_W}x${ICON_H})." && exit 1)
          echo "Purchase wiring OK: Swift in Xcode target, plugin registered, build 2, Swift 5.9, icon 1024x1024."
      # METHOD A (Code Signing Identities): Codemagic fetches the
      # uploaded/generated certificate + profile automatically from
      # environment.ios_signing above. No keychain/fetch CLI scripts.
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Verify a provisioning profile was fetched (fail fast if not)
        script: |
          ls ~/Library/MobileDevice/"Provisioning Profiles" 2>&1 || true
          ls ~/Library/MobileDevice/"Provisioning Profiles"/*.mobileprovision >/dev/null 2>&1 || (echo "ERROR: No provisioning profile was fetched from Code Signing Identities. Create/upload an App Store profile for com.allinview.app first (see file header), then re-run." && exit 1)
      - name: Verify native layers are present (no upload yet)
        script: |
          test -f ios/App/App/AllinViewStoreKit.swift
          test -d ios/App/App.xcworkspace
          grep -q "com.allinview.app" capacitor.config.ts
          grep -q "11.99" src/lib/storekit.ts
          ! grep -Eq "11[.]88" src/lib/storekit.ts src/App.tsx || (echo "FORBIDDEN PRICE FOUND" && exit 1)
      - name: Build IPA for distribution
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - dist/**/*
      - build/ios/ipa/*.ipa
      - ios/App/App/AllinViewStoreKit.swift
      - ios/App/App.xcodeproj/project.pbxproj
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
